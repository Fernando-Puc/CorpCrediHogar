name: Deploy static content to Pages
on: 
  push:
    branches: ["main"]
  workflow_dispatch: 
 
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: ./FrontendCCH

      - name: Build Angular
        run: npx ng build --configuration production --base-href /CorpCrediHogar/
        working-directory: ./FrontendCCH

      - name: Copy index.html to 404.html
        run: cp dist/FrontendCCH/browser/index.html dist/FrontendCCH/browser/404.html
        working-directory: ./FrontendCCH

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './FrontendCCH/dist/FrontendCCH/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
