<div class="mainContainer">
  <div class="subExpandForm">
    <h1 class="titleForm">Agregar Almacen</h1>
    <div class="subExpandBorder">
      <form [formGroup]="formgroup">
        <div class="yForm">
          <div class="x">
            <text-input type="text" label="Código" [controller]="formgroup.get('codigo')"> </text-input>
          </div>
          <div class="x">
            <text-input type="text" label="Nombre" [controller]="formgroup.get('nombre')"> </text-input>
          </div>
        </div>
      </form>
    </div>

    <div class="actions">
      <action-button variant="cancel" text="Cancelar" (click)="formgroup.dirty ? openDialog():closeDialog()"></action-button>
      <action-button variant="accept" text="Guardar" (click)="onSubmit()" [isDisabled]="!formgroup.valid"></action-button>
    </div>
  </div>
</div>
